<title>StockPilot AI — Advanced Offline Inventory</title>
<style>
:root{--bg:#f4f7fb;--panel:#fff;--text:#172033;--muted:#6b7280;--line:#e7ebf2;--primary:#635bff;--primary2:#8b5cf6;--cyan:#06b6d4;--green:#10b981;--orange:#f59e0b;--red:#ef4444;--nav:#111827;--nav2:#1d2440;--shadow:0 12px 35px rgba(31,41,55,.08)}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;font-weight:600}.primary{background:linear-gradient(135deg,var(--primary),var(--primary2));color:white;box-shadow:0 7px 18px #635bff2b}.ghost{background:#eef1f7;color:#263244}.danger{background:#fee2e2;color:#991b1b}.success{background:#dcfce7;color:#166534}.hidden{display:none}.login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 20%,#c4b5fd 0,transparent 28%),radial-gradient(circle at 80% 80%,#a5f3fc 0,transparent 28%),#111827}.login-card{width:420px;background:#ffffffee;backdrop-filter:blur(18px);border-radius:24px;padding:34px;box-shadow:0 30px 90px #0005}.logo{display:flex;align-items:center;gap:12px;font-weight:900;font-size:24px}.logo-icon{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:white;background:linear-gradient(135deg,#635bff,#06b6d4);box-shadow:0 10px 24px #635bff55}.field{margin:13px 0}.field label{display:block;font-size:12px;font-weight:800;color:#667085;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid #dfe4ec;border-radius:10px;background:#fff;outline:none}.field input:focus,.field select:focus{border-color:#8b5cf6;box-shadow:0 0 0 3px #8b5cf61a}.shell{display:grid;grid-template-columns:255px 1fr;min-height:100vh}.side{position:sticky;top:0;height:100vh;background:linear-gradient(180deg,#101426,#151a31 65%,#111827);color:#fff;padding:22px 16px;overflow:auto}.side .logo{padding:5px 8px 22px}.side .logo-icon{width:38px;height:38px;font-size:18px}.section-label{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:#7f879c;padding:18px 12px 7px}.nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;margin:4px 0;background:transparent;color:#c7ccda;padding:11px 12px}.nav button:hover,.nav button.active{background:linear-gradient(90deg,#ffffff15,#ffffff08);color:white}.nav button.active{box-shadow:inset 3px 0 #8b5cf6}.userbox{margin-top:18px;padding:13px;border:1px solid #ffffff12;border-radius:14px;background:#ffffff08}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#8b5cf6,#06b6d4);font-weight:800}.main{min-width:0;padding:25px 30px;max-width:1700px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}.top-left h2{margin:0 0 4px;font-size:25px}.top-left p{margin:0;color:var(--muted);font-size:13px}.top-actions{display:flex;align-items:center;gap:9px}.icon-btn{width:42px;height:42px;padding:0;background:white;border:1px solid var(--line);position:relative}.dot{position:absolute;right:8px;top:8px;width:7px;height:7px;background:var(--red);border-radius:50%}.profile{display:flex;align-items:center;gap:9px;background:#fff;padding:6px 11px 6px 7px;border-radius:12px;border:1px solid var(--line)}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:15px}.kpi{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden}.kpi:after{content:"";position:absolute;width:75px;height:75px;border-radius:50%;right:-30px;top:-30px;background:#635bff0e}.kpi .icon{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:#f0efff;color:#635bff}.kpi.green .icon{background:#e8fff7;color:#059669}.kpi.orange .icon{background:#fff7e7;color:#d97706}.kpi.red .icon{background:#fff0f0;color:#dc2626}.kpi.cyan .icon{background:#e9fbff;color:#0891b2}.kpi .label{font-size:12px;color:var(--muted);margin-top:12px}.kpi .value{font-size:25px;font-weight:900;margin-top:3px}.trend{font-size:11px;margin-top:7px;color:#059669}.grid{display:grid;grid-template-columns:1.45fr 1fr;gap:17px;margin-top:17px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:17px;margin-top:17px}.panel{background:#fff;border:1px solid var(--line);border-radius:17px;padding:19px;box-shadow:var(--shadow)}.panel h3{margin:0;font-size:15px}.panel-sub{font-size:12px;color:var(--muted);margin:5px 0 16px}.title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:17px}.title h1{margin:0;font-size:24px}.muted{color:var(--muted)}.toolbar{display:flex;gap:9px;margin-bottom:13px;flex-wrap:wrap}.toolbar input{padding:11px 13px;border:1px solid var(--line);border-radius:10px;width:300px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid #edf0f4;font-size:13px}th{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:#788194}tr:hover td{background:#fafbfe}.badge{padding:5px 9px;border-radius:99px;background:#eef2ff;font-size:11px;font-weight:800;white-space:nowrap}.low{background:#fee2e2;color:#991b1b}.good{background:#dcfce7;color:#166534}.warn{background:#fef3c7;color:#92400e}.blue{background:#e0f2fe;color:#075985}.actions{display:flex;gap:8px;flex-wrap:wrap}.chart{height:245px;display:flex;align-items:end;gap:10px;padding:15px 4px 25px}.bar{flex:1;min-width:15px;background:linear-gradient(180deg,#8b5cf6,#635bff);border-radius:7px 7px 2px 2px;position:relative;transition:.2s}.bar:hover{filter:brightness(1.08)}.bar span{position:absolute;top:100%;font-size:10px;color:#8a93a5;margin-top:6px;left:50%;transform:translateX(-50%)}.donut{width:180px;height:180px;border-radius:50%;margin:auto;background:conic-gradient(#635bff 0 42%,#06b6d4 42% 67%,#10b981 67% 84%,#f59e0b 84% 100%);display:grid;place-items:center}.donut:after{content:"Inventory";width:110px;height:110px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:13px;font-weight:800}.alert{display:flex;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;margin:8px 0}.alert .aicon{width:35px;height:35px;border-radius:10px;display:grid;place-items:center;background:#fff1f2}.progress{height:8px;background:#edf0f4;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,#635bff,#06b6d4);border-radius:99px}.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quick button{text-align:left;padding:14px;background:#f7f8fc;border:1px solid #e9ecf3}.quick button:hover{background:#f0efff;border-color:#d9d5ff}.ai-panel{background:linear-gradient(135deg,#17182d,#29215a);color:#fff;border:0}.ai-header{display:flex;justify-content:space-between;align-items:center}.ai-chip{background:#ffffff18;padding:6px 9px;border-radius:99px;font-size:10px;color:#c4b5fd}.ai-msg{display:flex;gap:10px;margin:12px 0}.ai-bubble{background:#ffffff0d;border:1px solid #ffffff12;border-radius:12px;padding:11px;font-size:12px;line-height:1.5}.ai-input{display:flex;gap:8px;margin-top:12px}.ai-input input{flex:1;background:#fff0;color:#fff;border:1px solid #ffffff25;padding:11px;border-radius:10px;outline:none}.ai-input input::placeholder{color:#a6abc1}.suggestions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.suggestions button{background:#ffffff0d;color:#d9d7ff;border:1px solid #ffffff14;padding:7px 9px;font-size:10px}.modal{position:fixed;inset:0;background:#090b1390;backdrop-filter:blur(5px);display:grid;place-items:center;padding:20px;z-index:30}.modalbox{background:#fff;border-radius:18px;padding:22px;max-width:700px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 30px 90px #0005}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.toast{position:fixed;right:25px;bottom:25px;background:#111827;color:#fff;padding:13px 17px;border-radius:11px;z-index:60;box-shadow:0 15px 35px #0003}.barcode{height:55px;display:flex;align-items:stretch;gap:2px;background:#fff;padding:7px 10px;border-radius:8px;border:1px solid var(--line)}.barcode i{display:block;background:#111}.barcode i:nth-child(3n){width:4px}.barcode i:nth-child(3n+1){width:2px}.barcode i:nth-child(3n+2){width:6px}.command{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;gap:8px;margin-bottom:18px;box-shadow:var(--shadow)}.command input{flex:1;border:0;outline:0;background:transparent}.empty{text-align:center;padding:35px;color:var(--muted)}@media(max-width:1100px){.cards{grid-template-columns:repeat(3,1fr)}.grid,.grid3{grid-template-columns:1fr}.shell{grid-template-columns:210px 1fr}}@media(max-width:760px){.shell{display:block}.side{height:auto;position:relative}.nav{display:grid;grid-template-columns:1fr 1fr}.main{padding:18px}.cards{grid-template-columns:1fr 1fr}.top{align-items:flex-start;flex-direction:column}.formgrid{grid-template-columns:1fr}.login-card{width:92%}}
</style>
</head>
<body><div id="app"></div>
<script>
const KEY='stockpilot_ai_v3';let db=JSON.parse(localStorage.getItem(KEY)||'null');let current=null,view='dashboard';
function seed(){db={users:[{id:1,name:'Admin',email:'admin@inventory.local',password:'Admin@123',role:'Admin'},{id:2,name:'Manager',email:'manager@inventory.local',password:'Manager@123',role:'Manager'},{id:3,name:'Sales Staff',email:'sales@inventory.local',password:'Sales@123',role:'Sales Staff'}],products:[{id:1,name:'Wireless Mouse',sku:'WM-001',category:'Electronics',brand:'LogiTech',purchase:500,sell:999,stock:42,min:10},{id:2,name:'Mechanical Keyboard',sku:'KB-001',category:'Electronics',brand:'LogiTech',purchase:700,sell:1299,stock:35,min:10},{id:3,name:'USB-C Cable',sku:'UC-001',category:'Accessories',brand:'Anker',purchase:250,sell:499,stock:60,min:15},{id:4,name:'Premium Notebook',sku:'NB-001',category:'Office Supplies',brand:'Classmate',purchase:80,sell:150,stock:20,min:10},{id:5,name:'Ergonomic Office Chair',sku:'OC-001',category:'Furniture',brand:'FeatherLite',purchase:6000,sell:8500,stock:6,min:8},{id:6,name:'Webcam HD',sku:'WC-001',category:'Electronics',brand:'LogiTech',purchase:1800,sell:2799,stock:18,min:8}],sales:[],purchases:[],transactions:[],audit:[],customers:[{id:1,name:'Walk-in Customer',phone:'-'},{id:2,name:'ABC Pvt Ltd',phone:'9876543210'},{id:3,name:'Chandigarh Tech Club',phone:'9811111111'}],suppliers:[{id:1,name:'Tech Supplies India',phone:'9876500000'},{id:2,name:'Office World',phone:'9876511111'},{id:3,name:'Digital Mart',phone:'9876522222'}],warehouses:[{id:1,name:'Main Warehouse',location:'Chandigarh'},{id:2,name:'Campus Store',location:'Mohali'}],notifications:[{id:1,type:'warning',text:'Ergonomic Office Chair is below minimum stock.',time:Date.now()},{id:2,type:'info',text:'AI Copilot is ready to analyze your inventory.',time:Date.now()}]};save()}function save(){localStorage.setItem(KEY,JSON.stringify(db))}if(!db)seed();
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(s){let d=document.createElement('div');d.className='toast';d.textContent=s;document.body.append(d);setTimeout(()=>d.remove(),2500)}
function login(){app.innerHTML='<div class="login"><div class="login-card"><div class="logo"><span class="logo-icon">✦</span> StockPilot AI</div><p class="muted" style="margin:8px 0 24px">Advanced offline inventory intelligence platform</p><div class="field"><label>Email</label><input id="email" value="admin@inventory.local"></div><div class="field"><label>Password</label><input id="password" type="password" value="Admin@123"></div><button class="primary" style="width:100%;padding:13px" onclick="doLogin()">Sign in to workspace →</button><div style="margin-top:16px;padding:11px;background:#f7f7fb;border-radius:10px;font-size:11px;color:#667085">Demo: <b>admin@inventory.local</b> / <b>Admin@123</b></div></div></div>'}
function doLogin(){let u=db.users.find(x=>x.email===email.value&&x.password===password.value);if(!u)return toast('Invalid login');current=u;render()}function logout(){current=null;login()}function nav(v){view=v;render()}
const labels={dashboard:['⌂','Dashboard'],products:['▦','Products'],inventory:['◈','Inventory'],purchases:['🛒','Purchases'],sales:['↗','Sales'],suppliers:['♜','Suppliers'],customers:['♙','Customers'],warehouses:['⌂','Warehouses'],reports:['◒','Reports & Analytics'],ai:['✦','AI Copilot'],notifications:['◉','Notifications'],audit:['☷','Audit Logs'],settings:['⚙','Settings']};
function render(){if(!current)return login();let navHtml=Object.entries(labels).map(([v,a])=>'<button class="'+(view===v?'active':'')+'" onclick="nav(\''+v+'\')"><span>'+a[0]+'</span>'+a[1]+'</button>').join('');app.innerHTML='<div class="shell"><aside class="side"><div class="logo"><span class="logo-icon">✦</span> StockPilot</div><div class="section-label">Workspace</div><div class="nav">'+navHtml+'</div><div class="userbox"><div style="display:flex;gap:9px;align-items:center"><div class="avatar">'+esc(current.name[0])+'</div><div><b style="font-size:12px">'+esc(current.name)+'</b><div style="font-size:10px;color:#9ca3af">'+esc(current.role)+'</div></div></div><button style="width:100%;margin-top:10px;background:#ffffff10;color:#c7ccda" onclick="logout()">↪ Logout</button></div></aside><main class="main"><div class="top"><div class="top-left"><h2>'+labels[view][1]+'</h2><p>Smart operations • local-first • real-time browser data</p></div><div class="top-actions"><button class="icon-btn" onclick="nav(\'notifications\')">🔔<span class="dot"></span></button><div class="profile"><div class="avatar">'+esc(current.name[0])+'</div><span style="font-size:12px"><b>'+esc(current.name)+'</b><br><span class="muted">'+esc(current.role)+'</span></span></div></div></div><div id="page"></div></main></div>';window[view]&&window[view]();}
function metrics(){let qty=db.products.reduce((s,p)=>s+p.stock,0),val=db.products.reduce((s,p)=>s+p.stock*p.purchase,0),sales=db.sales.reduce((s,x)=>s+x.total,0),profit=db.sales.reduce((s,x)=>s+x.profit,0),low=db.products.filter(p=>p.stock<=p.min).length;return{qty,val,sales,profit,low}}
function dashboard(){let m=metrics(),months=Array(12).fill(0);db.sales.forEach(x=>months[new Date(x.time).getMonth()]+=x.total);let max=Math.max(...months,1),low=db.products.filter(p=>p.stock<=p.min),recent=[...db.transactions].reverse().slice(0,5);page.innerHTML='<div class="cards"><div class="kpi"><div class="icon">▦</div><div class="label">Total Products</div><div class="value">'+db.products.length+'</div><div class="trend">↑ Catalog active</div></div><div class="kpi cyan"><div class="icon">◈</div><div class="label">Inventory Units</div><div class="value">'+m.qty+'</div><div class="trend">↑ Live stock</div></div><div class="kpi green"><div class="icon">₹</div><div class="label">Inventory Value</div><div class="value">₹'+m.val.toLocaleString()+'</div><div class="trend">Cost valuation</div></div><div class="kpi orange"><div class="icon">↗</div><div class="label">Total Sales</div><div class="value">₹'+m.sales.toLocaleString()+'</div><div class="trend">Transactions: '+db.sales.length+'</div></div><div class="kpi red"><div class="icon">!</div><div class="label">Low Stock</div><div class="value">'+m.low+'</div><div class="trend" style="color:#dc2626">Needs attention</div></div></div><div class="grid"><div class="panel"><div class="title"><div><h3>Sales Performance</h3><div class="panel-sub">Monthly revenue overview</div></div><span class="badge blue">Live analytics</span></div><div class="chart">'+months.map((v,i)=>'<div class="bar" title="₹'+v.toLocaleString()+'" style="height:'+Math.max(5,v/max*185)+'px"><span>'+['J','F','M','A','M','J','J','A','S','O','N','D'][i]+'</span></div>').join('')+'</div></div><div class="panel ai-panel"><div class="ai-header"><div><h3>✦ AI Inventory Copilot</h3><div style="font-size:11px;color:#aaa8c9;margin-top:5px">Offline intelligence engine</div></div><span class="ai-chip">● READY</span></div><div class="ai-msg"><div class="avatar">✦</div><div class="ai-bubble">'+aiInsight()+'</div></div><div class="suggestions"><button onclick="aiAsk(\'Show low stock items\')">Low stock</button><button onclick="aiAsk(\'Give sales summary\')">Sales summary</button><button onclick="aiAsk(\'What should I reorder?\')">Reorder advice</button></div><div class="ai-input"><input id="dashAi" placeholder="Ask: ‘Which product needs reorder?’" onkeydown="if(event.key===\'Enter\')aiAsk(this.value)"><button class="primary" onclick="aiAsk(dashAi.value)">Ask</button></div></div></div><div class="grid3"><div class="panel"><div class="title"><div><h3>Stock Alerts</h3><div class="panel-sub">Inventory health</div></div><span class="badge low">'+low.length+' alerts</span></div>'+ (low.length?low.map(p=>'<div class="alert"><div class="aicon">⚠</div><div style="flex:1"><b style="font-size:12px">'+esc(p.name)+'</b><div class="muted" style="font-size:11px">Only '+p.stock+' units left · minimum '+p.min+'</div><div class="progress" style="margin-top:8px"><i style="width:'+Math.min(100,p.stock/p.min*100)+'%"></i></div></div></div>').join(''):'<div class="empty">All stock levels are healthy 🎉</div>')+'</div><div class="panel"><div class="title"><div><h3>Quick Actions</h3><div class="panel-sub">Common operations</div></div></div><div class="quick"><button onclick="productModal()">＋ Add Product</button><button onclick="moveModal(\'in\')">📥 Stock In</button><button onclick="saleModal()">💰 New Sale</button><button onclick="purchaseModal()">🛒 New Purchase</button><button onclick="nav(\'ai\')">✦ Ask AI</button><button onclick="exportData()">⇩ Export Data</button></div></div><div class="panel"><div class="title"><div><h3>Inventory Mix</h3><div class="panel-sub">Category distribution</div></div></div><div class="donut"></div><div style="text-align:center;margin-top:12px;font-size:11px;color:#667085">Electronics • Accessories • Office • Furniture</div></div></div><div class="panel" style="margin-top:17px"><div class="title"><div><h3>Recent Activity</h3><div class="panel-sub">Latest inventory movements</div></div><button class="ghost" onclick="nav(\'audit\')">View audit →</button></div><table><tr><th>Time</th><th>Product</th><th>Action</th><th>Qty</th><th>New Stock</th></tr>'+recent.map(x=>'<tr><td>'+new Date(x.time).toLocaleString()+'</td><td>'+esc(x.product)+'</td><td><span class="badge blue">'+x.type+'</span></td><td>'+x.qty+'</td><td>'+x.newStock+'</td></tr>').join('')+(recent.length?'':'<tr><td colspan="5" class="empty">No activity yet</td></tr>')+'</table></div>'}
function aiInsight(){let m=metrics(),low=db.products.filter(p=>p.stock<=p.min);if(low.length)return 'I found <b>'+low.length+' low-stock item(s)</b>. '+esc(low[0].name)+' is at '+low[0].stock+' units versus a minimum of '+low[0].min+'. I recommend reviewing its reorder quantity.';return 'Inventory looks healthy. I can analyze sales, stock risk, products, purchases and help execute common operations from this dashboard.'}
function aiAsk(q){q=String(q||'').trim();if(!q)return;let l=q.toLowerCase(),ans='I can analyze your local inventory. Try “low stock”, “sales summary”, “reorder advice”, or “inventory value”.';if(l.includes('low')||l.includes('stock')){let x=db.products.filter(p=>p.stock<=p.min);ans=x.length?'<b>Low stock:</b> '+x.map(p=>esc(p.name)+' ('+p.stock+'/'+p.min+')').join(', ')+'.':'No low-stock products right now.'}if(l.includes('sales')){let m=metrics();ans='<b>Sales summary:</b> ₹'+m.sales.toLocaleString()+' revenue from '+db.sales.length+' orders, with ₹'+m.profit.toLocaleString()+' estimated profit.'}if(l.includes('reorder')||l.includes('buy')){let x=db.products.filter(p=>p.stock<=p.min);ans=x.length?'<b>Reorder priority:</b> '+x.map(p=>esc(p.name)+' — suggested '+Math.max(5,p.min*2-p.stock)+' units').join('; ')+'.':'No urgent reorder is detected.'}if(l.includes('value'))ans='<b>Inventory valuation:</b> ₹'+metrics().val.toLocaleString()+' at purchase cost.';if(l.includes('product'))ans='<b>Catalog:</b> '+db.products.length+' products across '+new Set(db.products.map(p=>p.category)).size+' categories.';if(view==='dashboard'&&$('dashAi')){$('dashAi').value='';let box=document.createElement('div');box.className='ai-msg';box.innerHTML='<div class="avatar">✦</div><div class="ai-bubble">'+ans+'</div>';$('dashAi').closest('.ai-panel').insertBefore(box,$('dashAi').closest('.ai-input'))}else{view='ai';render();setTimeout(()=>{if($('aiQuestion')){$('aiQuestion').value=q;$('aiResponse').innerHTML=ans}},0)}}
function ai(){page.innerHTML='<div class="grid"><div class="panel ai-panel" style="min-height:480px"><div class="ai-header"><div><h3 style="font-size:20px">✦ StockPilot AI Copilot</h3><div style="font-size:12px;color:#aaa8c9;margin-top:5px">Your offline inventory analyst & action assistant</div></div><span class="ai-chip">● LOCAL AI</span></div><div style="margin-top:25px" class="ai-msg"><div class="avatar">✦</div><div class="ai-bubble">Hi '+esc(current.name)+'! I can inspect your inventory data and explain <b>sales, profit, stock risks, reorder priorities, inventory value, product performance</b> and more. No internet connection is required.</div></div><div id="aiResponse" class="ai-msg"><div class="avatar">✦</div><div class="ai-bubble">Ask me something below to get a live analysis.</div></div><div class="suggestions"><button onclick="aiAsk(\'Show low stock items\')">⚠ Low stock</button><button onclick="aiAsk(\'Give sales summary\')">↗ Sales summary</button><button onclick="aiAsk(\'What should I reorder?\')">🛒 Reorder advice</button><button onclick="aiAsk(\'Show inventory value\')">₹ Inventory value</button><button onclick="aiAsk(\'Show product count\')">▦ Product count</button></div><div class="ai-input"><input id="aiQuestion" placeholder="Ask your inventory question..."><button class="primary" onclick="aiAsk(aiQuestion.value)">Analyze</button></div></div><div class="panel"><h3>What AI can do</h3><div class="panel-sub">Rule-based offline intelligence — works without an API key</div><div class="alert"><div class="aicon">⚠</div><div><b>Risk detection</b><div class="muted">Find low/out-of-stock products and explain the risk.</div></div></div><div class="alert"><div class="aicon">↗</div><div><b>Business summary</b><div class="muted">Calculate revenue, profit, inventory value and order activity.</div></div></div><div class="alert"><div class="aicon">🛒</div><div><b>Reorder suggestions</b><div class="muted">Suggest replenishment quantities using minimum stock levels.</div></div></div><div class="alert"><div class="aicon">⌕</div><div><b>Natural commands</b><div class="muted">Try: “low stock”, “sales summary”, “reorder advice”.</div></div></div></div></div>'}
function header(title,sub,button=''){return '<div class="title"><div><h1>'+title+'</h1><p class="muted">'+sub+'</p></div>'+button+'</div>'}
function products(){page.innerHTML=header('Products','Catalog, pricing, SKU and stock intelligence','<button class="primary" onclick="productModal()">＋ Add Product</button>')+'<div class="command"><span>⌕</span><input id="q" placeholder="Search product, SKU, category or brand..." oninput="filterRows()"><span class="muted">'+db.products.length+' items</span></div><div class="panel"><div class="table-wrap"><table id="tbl"><tr><th>Product</th><th>SKU / Category</th><th>Pricing</th><th>Margin</th><th>Stock</th><th>Barcode</th><th></th></tr>'+db.products.map(p=>'<tr><td><b>'+esc(p.name)+'</b><br><span class="muted">'+esc(p.brand)+'</span></td><td>'+p.sku+'<br><span class="muted">'+esc(p.category)+'</span></td><td>₹'+p.purchase+' / ₹'+p.sell+'</td><td><span class="badge good">₹'+(p.sell-p.purchase)+'</span></td><td><span class="badge '+(p.stock<=p.min?'low':'good')+'">'+p.stock+' units</span><br><small class="muted">Min '+p.min+'</small></td><td><div class="barcode">'+Array.from({length:15},(_,i)=>'<i></i>').join('')+'</div><small>'+p.sku+'</small></td><td><button class="ghost" onclick="productModal('+p.id+')">Edit</button></td></tr>').join('')+'</table></div></div>'}
function filterRows(){let q=$('q').value.toLowerCase();[...$('tbl').rows].slice(1).forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?'':'none')}
function productModal(id){let p=db.products.find(x=>x.id===id)||{};page.insertAdjacentHTML('beforeend','<div class="modal"><div class="modalbox"><div class="title"><div><h2>'+(id?'Edit':'Add')+' Product</h2><p class="muted">Product master data</p></div><button class="ghost" onclick="this.closest(\'.modal\').remove()">×</button></div><div class="formgrid"><div class="field"><label>Name</label><input id="pn" value="'+esc(p.name||'')+'"></div><div class="field"><label>SKU</label><input id="ps" value="'+esc(p.sku||'')+'"></div><div class="field"><label>Category</label><input id="pc" value="'+esc(p.category||'Electronics')+'"></div><div class="field"><label>Brand</label><input id="pb" value="'+esc(p.brand||'')+'"></div><div class="field"><label>Purchase Price</label><input id="ppu" type="number" value="'+(p.purchase||0)+'"></div><div class="field"><label>Selling Price</label><input id="pse" type="number" value="'+(p.sell||0)+'"></div><div class="field"><label>Opening Stock</label><input id="pst" type="number" value="'+(p.stock||0)+'"></div><div class="field"><label>Minimum Stock</label><input id="pmi" type="number" value="'+(p.min||0)+'"></div></div><div class="actions"><button class="primary" onclick="saveProduct('+(id||0)+')">Save Product</button><button class="ghost" onclick="this.closest(\'.modal\').remove()">Cancel</button></div></div></div>')}
function saveProduct(id){let p={id:id||Date.now(),name:pn.value,sku:ps.value,category:pc.value,brand:pb.value,purchase:+ppu.value,sell:+pse.value,stock:+pst.value,min:+pmi.value};if(id){let i=db.products.findIndex(x=>x.id===id);db.products[i]=p}else db.products.push(p);save();toast('Product saved successfully');nav('products')}
function inventory(){let low=db.products.filter(p=>p.stock<=p.min),out=db.products.filter(p=>p.stock===0);page.innerHTML=header('Inventory Control','Transactions, stock levels and warehouse visibility','<div class="actions"><button class="primary" onclick="moveModal(\'in\')">＋ Stock In</button><button class="ghost" onclick="moveModal(\'out\')">− Stock Out</button><button class="ghost" onclick="moveModal(\'adjust\')">↕ Adjust</button></div>')+'<div class="cards"><div class="kpi cyan"><div class="label">Units on Hand</div><div class="value">'+metrics().qty+'</div></div><div class="kpi green"><div class="label">Inventory Value</div><div class="value">₹'+metrics().val.toLocaleString()+'</div></div><div class="kpi red"><div class="label">Low Stock</div><div class="value">'+low.length+'</div></div><div class="kpi red"><div class="label">Out of Stock</div><div class="value">'+out.length+'</div></div><div class="kpi orange"><div class="label">Movements</div><div class="value">'+db.transactions.length+'</div></div></div><div class="panel" style="margin-top:17px"><table><tr><th>Product</th><th>Warehouse</th><th>Quantity</th><th>Min</th><th>Health</th></tr>'+db.products.map(p=>'<tr><td><b>'+esc(p.name)+'</b><br><span class="muted">'+p.sku+'</span></td><td>Main Warehouse</td><td>'+p.stock+'</td><td>'+p.min+'</td><td><span class="badge '+(p.stock===0?'low':p.stock<=p.min?'warn':'good')+'">'+(p.stock===0?'Out of Stock':p.stock<=p.min?'Low Stock':'Healthy')+'</span></td></tr>').join('')+'</table></div><div class="panel" style="margin-top:17px"><h3>Transaction Ledger</h3><div class="panel-sub">Every stock movement preserves history.</div><table><tr><th>Time</th><th>Product</th><th>Type</th><th>Qty</th><th>New Stock</th></tr>'+db.transactions.slice().reverse().slice(0,20).map(x=>'<tr><td>'+new Date(x.time).toLocaleString()+'</td><td>'+esc(x.product)+'</td><td><span class="badge blue">'+x.type+'</span></td><td>'+x.qty+'</td><td>'+x.newStock+'</td></tr>').join('')+'</table></div>'}
function moveModal(type){page.insertAdjacentHTML('beforeend','<div class="modal"><div class="modalbox"><h2>'+({in:'Stock In',out:'Stock Out',adjust:'Stock Adjustment'}[type])+'</h2><div class="field"><label>Product</label><select id="mp">'+db.products.map(p=>'<option value="'+p.id+'">'+esc(p.name)+' ('+p.stock+' units)</option>').join('')+'</select></div><div class="field"><label>'+ (type==='adjust'?'New absolute stock':'Quantity')+'</label><input id="mq" type="number" min="0" value="1"></div><div class="actions"><button class="primary" onclick="moveStock(\''+type+'\')">Confirm</button><button class="ghost" onclick="this.closest(\'.modal\').remove()">Cancel</button></div></div></div>')}
function moveStock(type){let p=db.products.find(x=>x.id==mp.value),q=+mq.value;if(type==='out'&&p.stock<q)return toast('Insufficient stock');let old=p.stock;if(type==='adjust'){p.stock=q}else p.stock+=type==='in'?q:-q;let delta=Math.abs(p.stock-old);db.transactions.push({time:Date.now(),product:p.name,type:type==='in'?'STOCK_IN':type==='out'?'STOCK_OUT':'ADJUSTMENT',qty:delta,newStock:p.stock});db.audit.push({time:Date.now(),user:current.name,action:type==='in'?'Stock In':type==='out'?'Stock Out':'Stock Adjustment'});if(p.stock<=p.min)db.notifications.unshift({id:Date.now(),type:'warning',text:p.name+' is now at '+p.stock+' units.',time:Date.now()});save();toast('Inventory updated');nav('inventory')}
function purchases(){page.innerHTML=header('Purchases','Purchase orders, suppliers and receiving','<button class="primary" onclick="purchaseModal()">＋ New Purchase</button>')+'<div class="panel"><table><tr><th>PO</th><th>Supplier</th><th>Product</th><th>Qty</th><th>Total</th><th>Status</th><th></th></tr>'+db.purchases.map(x=>'<tr><td>'+x.no+'</td><td>'+esc(x.supplier)+'</td><td>'+esc(x.product)+'</td><td>'+x.qty+'</td><td>₹'+x.total.toLocaleString()+'</td><td><span class="badge '+(x.received?'good':'warn')+'">'+x.status+'</span></td><td>'+(!x.received?'<button class="ghost" onclick="receive('+x.id+')">Receive</button>':'✓ Received')+'</td></tr>').join('')+(db.purchases.length?'':'<tr><td colspan="7" class="empty">No purchase orders yet.</td></tr>')+'</table></div>'}
function purchaseModal(){page.insertAdjacentHTML('beforeend','<div class="modal"><div class="modalbox"><h2>New Purchase Order</h2><div class="formgrid"><div class="field"><label>Supplier</label><select id="sup">'+db.suppliers.map(s=>'<option>'+esc(s.name)+'</option>').join('')+'</select></div><div class="field"><label>Product</label><select id="pp">'+db.products.map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join('')+'</select></div><div class="field"><label>Quantity</label><input id="pq2" type="number" min="1" value="10"></div></div><button class="primary" onclick="createPurchase()">Create Purchase</button></div></div>')}
function createPurchase(){let p=db.products.find(x=>x.id==pp.value),q=+pq2.value;db.purchases.push({id:Date.now(),no:'PO-'+Date.now().toString().slice(-6),supplier:sup.value,product:p.name,productId:p.id,qty:q,total:q*p.purchase,status:'Pending',received:false,time:Date.now()});db.audit.push({time:Date.now(),user:current.name,action:'Created Purchase Order'});save();toast('Purchase order created');nav('purchases')}
function receive(id){let x=db.purchases.find(a=>a.id===id),p=db.products.find(a=>a.id===x.productId);p.stock+=x.qty;x.received=true;x.status='Received';db.transactions.push({time:Date.now(),product:p.name,type:'PURCHASE_RECEIVE',qty:x.qty,newStock:p.stock});db.audit.push({time:Date.now(),user:current.name,action:'Received '+x.no});save();toast('Purchase received — stock increased');nav('purchases')}
function sales(){page.innerHTML=header('Sales & Orders','Customer orders with automatic stock deduction','<button class="primary" onclick="saleModal()">＋ New Sale</button>')+'<div class="panel"><table><tr><th>Order</th><th>Customer</th><th>Product</th><th>Qty</th><th>Total</th><th>Profit</th><th>Date</th></tr>'+db.sales.map(x=>'<tr><td>'+x.no+'</td><td>'+esc(x.customer)+'</td><td>'+esc(x.product)+'</td><td>'+x.qty+'</td><td>₹'+x.total.toLocaleString()+'</td><td><span class="badge good">₹'+x.profit.toLocaleString()+'</span></td><td>'+new Date(x.time).toLocaleDateString()+'</td></tr>').join('')+(db.sales.length?'':'<tr><td colspan="7" class="empty">No sales yet. Create your first order.</td></tr>')+'</table></div>'}
function saleModal(){page.insertAdjacentHTML('beforeend','<div class="modal"><div class="modalbox"><h2>New Sales Order</h2><div class="formgrid"><div class="field"><label>Customer</label><select id="cus">'+db.customers.map(s=>'<option>'+esc(s.name)+'</option>').join('')+'</select></div><div class="field"><label>Product</label><select id="sp">'+db.products.map(p=>'<option value="'+p.id+'">'+esc(p.name)+' — ₹'+p.sell+' — stock '+p.stock+'</option>').join('')+'</select></div><div class="field"><label>Quantity</label><input id="sq" type="number" min="1" value="1"></div></div><button class="primary" onclick="createSale()">Confirm Sale</button></div></div>')}
function createSale(){let p=db.products.find(x=>x.id==sp.value),q=+sq.value;if(p.stock<q)return toast('Insufficient stock for this sale');let total=q*p.sell,profit=q*(p.sell-p.purchase);p.stock-=q;db.sales.push({id:Date.now(),no:'SO-'+Date.now().toString().slice(-6),customer:cus.value,product:p.name,productId:p.id,qty:q,total,profit,time:Date.now()});db.transactions.push({time:Date.now(),product:p.name,type:'SALE',qty:q,newStock:p.stock});db.audit.push({time:Date.now(),user:current.name,action:'Created Sales Order'});if(p.stock<=p.min)db.notifications.unshift({id:Date.now(),type:'warning',text:p.name+' reached low stock after sale.',time:Date.now()});save();toast('Sale created — stock automatically reduced');nav('sales')}
function simple(type){let title=type[0].toUpperCase()+type.slice(1);let arr=db[type];page.innerHTML=header(title,'Master data management','<button class="primary" onclick="masterModal(\''+type+'\')">＋ Add '+title.slice(0,-1)+'</button>')+'<div class="panel"><table><tr>'+Object.keys(arr[0]||{}).filter(k=>!['id'].includes(k)).map(k=>'<th>'+k+'</th>').join('')+'</tr>'+arr.map(x=>'<tr>'+Object.keys(x).filter(k=>k!=='id').map(k=>'<td>'+esc(x[k])+'</td>').join('')+'</tr>').join('')+'</table></div>'}function suppliers(){simple('suppliers')}function customers(){simple('customers')}function warehouses(){simple('warehouses')}
function masterModal(type){let title=type==='warehouses'?'Warehouse':type==='suppliers'?'Supplier':'Customer';let fields=type==='warehouses'?['name','location']:['name','phone'];page.insertAdjacentHTML('beforeend','<div class="modal"><div class="modalbox"><h2>Add '+title+'</h2>'+fields.map(f=>'<div class="field"><label>'+f+'</label><input id="m_'+f+'"></div>').join('')+'<button class="primary" onclick="saveMaster(\''+type+'\')">Save</button></div></div>')}function saveMaster(type){let x={id:Date.now(),name:$('m_name').value};if(type==='warehouses')x.location=$('m_location').value;else x.phone=$('m_phone').value;db[type].push(x);save();toast('Saved');nav(type)}
function reports(){let m=metrics(),monthly=Array(12).fill(0);db.sales.forEach(x=>monthly[new Date(x.time).getMonth()]+=x.total);let max=Math.max(...monthly,1);page.innerHTML=header('Reports & Analytics','Management insights from your local transaction database','<button class="ghost" onclick="exportData()">⇩ Export JSON</button>')+'<div class="cards"><div class="kpi orange"><div class="label">Revenue</div><div class="value">₹'+m.sales.toLocaleString()+'</div></div><div class="kpi green"><div class="label">Profit</div><div class="value">₹'+m.profit.toLocaleString()+'</div></div><div class="kpi cyan"><div class="label">Transactions</div><div class="value">'+db.transactions.length+'</div></div><div class="kpi red"><div class="label">Low Stock</div><div class="value">'+m.low+'</div></div><div class="kpi"><div class="label">Purchase Orders</div><div class="value">'+db.purchases.length+'</div></div></div><div class="grid"><div class="panel"><h3>Monthly Sales Trend</h3><div class="panel-sub">Revenue by month</div><div class="chart">'+monthly.map((v,i)=>'<div class="bar" title="₹'+v.toLocaleString()+'" style="height:'+Math.max(5,v/max*185)+'px"><span>'+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][i]+'</span></div>').join('')+'</div></div><div class="panel"><h3>AI Business Insights</h3><div class="panel-sub">Automated observations</div><div class="alert"><div class="aicon">✦</div><div><b>Inventory value</b><div class="muted">₹'+m.val.toLocaleString()+' at purchase cost.</div></div></div><div class="alert"><div class="aicon">⚠</div><div><b>Stock risk</b><div class="muted">'+m.low+' products need attention.</div></div></div><div class="alert"><div class="aicon">↗</div><div><b>Profitability</b><div class="muted">Current estimated profit is ₹'+m.profit.toLocaleString()+'.</div></div></div></div></div>'}
function notifications(){page.innerHTML=header('Notifications','Operational alerts and system intelligence','<button class="ghost" onclick="db.notifications=[];save();nav(\'notifications\')">Clear all</button>')+'<div class="panel">'+(db.notifications.length?db.notifications.map(n=>'<div class="alert"><div class="aicon">'+(n.type==='warning'?'⚠':'✦')+'</div><div style="flex:1"><b>'+esc(n.text)+'</b><div class="muted" style="font-size:11px">'+new Date(n.time).toLocaleString()+'</div></div></div>').join(''):'<div class="empty">No notifications. You are all caught up 🎉</div>')+'</div>'}
function audit(){page.innerHTML=header('Audit Logs','Traceability of important actions')+'<div class="panel"><table><tr><th>Time</th><th>User</th><th>Action</th></tr>'+db.audit.slice().reverse().map(x=>'<tr><td>'+new Date(x.time).toLocaleString()+'</td><td>'+esc(x.user)+'</td><td>'+esc(x.action)+'</td></tr>').join('')+(db.audit.length?'':'<tr><td colspan="3" class="empty">No audit events yet.</td></tr>')+'</table></div>'}
function settings(){page.innerHTML=header('Settings','Local application controls')+'<div class="grid"><div class="panel"><h3>Workspace</h3><div class="field"><label>System Name</label><input value="StockPilot AI" readonly></div><div class="field"><label>Mode</label><input value="Offline / Local Storage" readonly></div><div class="field"><label>Data Key</label><input value="'+KEY+'" readonly></div></div><div class="panel"><h3>Data Management</h3><p class="muted" style="font-size:12px">Your data is stored locally in this browser. Export it before clearing browser data.</p><div class="actions"><button class="primary" onclick="exportData()">⇩ Export Backup</button><button class="danger" onclick="resetData()">Reset Demo Data</button></div></div></div>'}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='stockpilot-backup.json';a.click();toast('Backup exported')}
function resetData(){if(confirm('Reset all local data to demo data?')){localStorage.removeItem(KEY);location.reload()}}
login();
</script></body></html>
